# Generated by implement_sweety_observability_fixes.sh — initial thresholds are configurable defaults,
# not derived from observed behaviour. Tune after collecting data. Add to prometheus.yml rule_files.
groups:
  - name: sweety_inventory
    rules:
      - alert: SweetyLowStock
        expr: sweety_product_stock_units > 0 and sweety_product_stock_units < 3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Low stock for product {{ $labels.product_id }} ({{ $labels.category }})"
          description: "{{ $value }} units left. Remediation: restock or review reorder level."
      - alert: SweetyOutOfStock
        expr: sweety_product_stock_units == 0
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Out of stock: product {{ $labels.product_id }}"
          description: "Verify whether the product should still be listed/active."
      - alert: SweetyInventorySyncStale
        expr: time() - sweety_inventory_sync_last_success_timestamp_seconds > 300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Inventory gauges have not refreshed for >5m"
          description: "Check DB connectivity and SWEETY_OBS_INVENTORY_SQL; stock alerts may be unreliable."
      - alert: SweetyInventorySyncFailing
        expr: increase(sweety_inventory_sync_failures_total[10m]) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Inventory sync failures in the last 10m"
  - name: sweety_platform
    rules:
      - alert: SweetyTargetDown
        expr: up{job=~"sweety.*"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Scrape target {{ $labels.instance }} (job {{ $labels.job }}) is down"
      - alert: SweetyDatabaseUnavailable
        expr: sweety_observability_db_up == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "API cannot reach its database"
          description: "Readiness (/readyz) returns 503 while this fires. Check DB container/host and credentials."
  # HTTP alerts omitted: existing http_requests_total/duration metrics were found in source.
